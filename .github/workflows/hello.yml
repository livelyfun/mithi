
name: Hello Workflow

on:
  push:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Say Hello
        run: echo "Hello from GitHub Actions!"

      - name: show date
        run: date

      - name: show Current user
        run: whooami

      - name: Show Current Directory
        run: pwd

      - name: List Files
        run: ls -la
